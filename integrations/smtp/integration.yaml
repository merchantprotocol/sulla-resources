apiVersion: sulla/v1
kind: Integration
id: smtp
name: SMTP Email
description: Generic SMTP server for transactional + notification email.
category: Communication
version: 1.0.0
lastUpdated: 2026-04-21 00:00:00
developer: Sulla
sort: 19
paid: false
